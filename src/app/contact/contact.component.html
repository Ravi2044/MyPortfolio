<!-- contact.component.html -->
<div class="container my-5">
  <h2 class="text-center mb-4">Contact Me</h2>
  <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="p-4 border rounded shadow-sm">

    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text"
             id="name"
             class="form-control"
             [(ngModel)]="contactData.name"
             name="name"
             required>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email"
             id="email"
             class="form-control"
             [(ngModel)]="contactData.email"
             name="email"
             required>   
    </div>

    <div class="mb-3">
      <label for="message" class="form-label">Message</label>
      <textarea id="message"
                class="form-control"
                rows="4"
                [(ngModel)]="contactData.message"
                name="message"
                required></textarea>
    </div>

    <button type="submit" [disabled]="!contactForm.valid" class="btn btn-primary w-100">Send Message</button>
  </form>
</div>
