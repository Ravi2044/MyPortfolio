<div class="container py-5">
  <div class="text-center mb-5">
    <div class="badge badge-glass mb-3"><i class="bi bi-file-earmark-plus text-info"></i> Create</div>
    <h2 class="fw-bold">Add a New Blog</h2>
  </div>

  <form (ngSubmit)="onSubmit()" class="glass-card p-4 p-md-5 mx-auto" style="max-width: 600px;">
    <div class="mb-4">
      <label class="form-label text-secondary-color fw-semibold">Blog Title</label>
      <input type="text" class="form-control form-glass" [(ngModel)]="blog.title" name="title" placeholder="Enter article title" required>
    </div>

    <div class="mb-4">
      <label class="form-label text-secondary-color fw-semibold">Author</label>
      <input type="text" class="form-control form-glass" [(ngModel)]="blog.author" name="author" placeholder="Author name" required>
    </div>

    <div class="mb-4">
      <label class="form-label text-secondary-color fw-semibold">Content</label>
      <textarea class="form-control form-glass" rows="6" [(ngModel)]="blog.content" name="content" placeholder="Write your blog post content here..." required></textarea>
    </div>

    <button type="submit" class="btn-premium w-100 justify-content-center py-3">
      <i class="bi bi-cloud-upload"></i> Publish Article
    </button>

    <p class="mt-3 text-success fw-semibold" *ngIf="message"><i class="bi bi-check-circle-fill"></i> {{ message }}</p>
  </form>
</div>
