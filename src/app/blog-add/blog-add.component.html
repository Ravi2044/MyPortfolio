
<div class="container mt-5">
  <h2 class="text-center mb-4">Add a New Blog</h2>

  <form (ngSubmit)="onSubmit()" class="card shadow p-4 mx-auto" style="max-width: 600px;">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" class="form-control" [(ngModel)]="blog.title" name="title" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Author</label>
      <input type="text" class="form-control" [(ngModel)]="blog.author" name="author" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Content</label>
      <textarea class="form-control" rows="4" [(ngModel)]="blog.content" name="content" required></textarea>
    </div>

    <button type="submit" class="btn btn-primary w-100">Add Blog</button>

    <p class="mt-3 text-success" *ngIf="message">{{ message }}</p>
  </form>
</div>
