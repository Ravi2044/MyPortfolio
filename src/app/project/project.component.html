<section class="container py-5">
  <h2 class="text-center mb-5 fw-bold">Products & Services</h2>
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let product of products">
      <div class="card h-100 shadow-sm">
        <img src="{{product.image}}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="{{product.title}}">
        <div class="card-body d-flex flex-column">
          <span class="badge bg-secondary mb-2 align-self-start">{{product.badge}}</span>
          <h5 class="card-title fw-bold">{{product.title}}</h5>
          <p class="card-text text-muted flex-grow-1">{{product.description}}</p>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <span class="fw-bold fs-5 text-success">{{product.price}}</span>
            <a href="{{product.link}}" class="btn btn-primary">{{ product.badge === 'Freelance Service' ? 'Inquire Now' : 'Buy Now' }}</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
