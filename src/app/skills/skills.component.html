<div class="skills-section container py-5">
  <div class="text-center mb-5">
    <div class="badge badge-glass mb-3"><i class="bi bi-cpu text-info"></i> Expertise</div>
    <h2 class="fw-bold">Technical Capabilities</h2>
  </div>

  <!-- Filter tabs -->
  <div class="filter-tabs">
    <button 
      *ngFor="let cat of categories" 
      class="filter-btn" 
      [class.active]="selectedCategory === cat" 
      (click)="selectCategory(cat)">
      {{ cat }}
    </button>
  </div>

  <!-- Grid of Skills -->
  <div class="row g-4 justify-content-center">
    <div class="col-md-6 col-lg-4" *ngFor="let skill of filteredSkills">
      <div class="skill-card">
        <div class="icon-wrapper">
          <i [class]="skill.icon"></i>
        </div>
        <h4>{{ skill.title }}</h4>
        <p>{{ skill.description }}</p>
      </div>
    </div>
  </div>
</div>
