

<div class="container mt-4">
  <h2 class="text-center mb-4">Latest Blogs</h2>

  <div *ngIf="loading" class="text-center">
    <p>Loading blogs...</p>
  </div>

  <div class="row" *ngIf="!loading && blogs.length > 0">
    <div class="col-md-4 mb-4" *ngFor="let blog of blogs">
      <div class="card shadow-lg border-0 rounded-3 h-100">
        <div class="card-body">
          <h5 class="card-title">{{ blog.title }}</h5>
          <p class="card-text text-muted">
            By {{ blog.author }} | {{ blog.date | date:'mediumDate' }}
          </p>
          <p class="card-text">{{ blog.content }}</p>
        </div>
        <div class="card-footer bg-transparent border-0 text-end">
          <button class="btn btn-sm btn-danger" (click)="deleteBlog(blog.id!)">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <p *ngIf="!loading && blogs.length === 0" class="text-center">
    No blogs found. Add a new one below!
  </p>
</div>
